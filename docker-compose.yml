services:

  postgres:
    image: postgres:17-alpine
    container_name: driftstay-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: driftstay
      POSTGRES_USER: driftstay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftstay_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftstay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: driftstay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: driftstay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:latest
    container_name: driftstay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: driftstay-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driftstay-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/driftstay
      POSTGRES_USER: driftstay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftstay_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
